# pg_hba.conf gestionado por deploy/bootstrap/20-postgres.sh
# Regla: nada de "trust", nada de conexiones remotas. Solo localhost con scram.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Mantenimiento local: el usuario del sistema postgres entra por socket sin
# contraseña (peer). Es lo que usan pg_dump, psql y las tareas de respaldo.
local   all             postgres                                peer

# Cualquier otro rol necesita contraseña, incluso por socket.
local   all             all                                     scram-sha-256

# La app y las migraciones se conectan a 127.0.0.1:5432 con contraseña.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Sin líneas para 0.0.0.0/0: PostgreSQL solo escucha en localhost (§4.2).

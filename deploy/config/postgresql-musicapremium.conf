# Ajuste de PostgreSQL para el VPS (§4.4 del plan).
# Se instala en /etc/postgresql/@@PG_VERSION@@/main/conf.d/ y por ser el último
# archivo leído, sus valores ganan sobre postgresql.conf.
# Calculado para 4 vCPU / 8 GB RAM / disco NVMe.

# --- Red: la base nunca se expone a internet ---
listen_addresses = 'localhost'
port = 5432
max_connections = 50
password_encryption = 'scram-sha-256'

# --- Memoria ---
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
effective_io_concurrency = 200

# --- WAL y checkpoints ---
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB
wal_level = replica          # permite pg_basebackup y archivado si se activa después

# --- Planificador (SSD/NVMe) ---
random_page_cost = 1.1

# --- Paralelismo para 4 núcleos ---
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Tiempo: la base siempre en UTC. La app convierte a America/Lima al mostrar ---
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'

# --- Cortafuegos de consultas colgadas ---
# statement_timeout de 15 s protege de una consulta que bloquee el checkout.
# Las migraciones usan el rol mpb_migrator, que lo lleva más alto (ver setup).
statement_timeout = '15s'
idle_in_transaction_session_timeout = '30s'
lock_timeout = '5s'

# --- Registro ---
log_min_duration_statement = 500     # solo consultas lentas
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 10000
log_line_prefix = '%m [%p] %q%u@%d '

# --- Autovacuum algo más agresivo: orders y payment_events cambian mucho ---
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Estadísticas para diagnosticar consultas ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
